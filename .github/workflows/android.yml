name: Build FRIDA Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install

      - name: Bundle GPS plugin
        run: npx esbuild src/gps.js --bundle --outfile=www/assets/gps.bundle.js --format=iife
        
      - name: Add Android platform
        run: npx cap add android

      - name: Add GPS permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permissions = [
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION"
          ]

          insert = ""
          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if tag not in content:
                  insert += f"    {tag}\n"

          if insert:
              start = content.find("<manifest")
              pos = content.find(">", start) + 1
              content = content[:pos] + "\n" + insert + content[pos:]
              manifest.write_text(content)

          print("GPS permissions configured.")
          PY

      - name: Generate Android app icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#C8102E' --iconBackgroundColorDark '#C8102E'
        
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDA-v1.4-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
