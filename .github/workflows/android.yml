name: Build FRIDA Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install

      - name: Bundle GPS plugin
        run: npx esbuild src/gps.js --bundle --outfile=www/assets/gps.bundle.js --format=iife
        
      - name: Add Android platform
        run: npx cap add android

      - name: Add GPS permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permissions = [
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION"
          ]

          insert = ""
          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if tag not in content:
                  insert += f"    {tag}\n"

          if insert:
              start = content.find("<manifest")
              pos = content.find(">", start) + 1
              content = content[:pos] + "\n" + insert + content[pos:]
              manifest.write_text(content)

          print("GPS permissions configured.")
          PY

      - name: Generate Android app icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#C8102E' --iconBackgroundColorDark '#C8102E'
        
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Read app version
        id: app-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDA-v${{ steps.app-version.outputs.version }}-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_KV_NAMESPACE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "Cloudflare KV secrets are not configured; skipping direct-download publish."
            exit 0
          fi
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -gt 26214400 ]; then
            echo "APK is larger than the 25 MiB Cloudflare KV value limit; direct publish skipped."
            exit 0
          fi
          curl --fail-with-body --silent --show-error -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/frida-latest.apk" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary "@$APK"
          curl --fail-with-body --silent --show-error -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/frida-version.txt" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: text/plain" --data-binary "${{ steps.app-version.outputs.version }}"
          echo "FRIDA v${{ steps.app-version.outputs.version }} published to Cloudflare KV."
